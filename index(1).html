<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Sound</title>
<style>
:root { --bg: #f2f4f6; --card: #ffffff; --ink: #14212b; --muted: #5d6c78; --line: #d6dee4; --go: #0b7a83; --ok: #1d7a3f; --bad: #b3261e; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d151b; --card: #16222b; --ink: #e4ecf0; --muted: #91a4b0; --line: #26363f; --go: #3fbfc7; --ok: #5cc98a; --bad: #f07a72; color-scheme: dark; }
}
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font-size: 26px; }
p { margin: 0; color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 5px; }
.tabs button { background: transparent; color: var(--muted); padding: 12px; font-size: 17px; }
.tabs button.on { background: var(--go); color: var(--card); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
label { font-size: 13px; font-weight: 600; color: var(--muted); }
input, textarea { font: 17px ui-monospace, monospace; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
textarea { min-height: 80px; resize: vertical; }
button { font: 700 18px system-ui, sans-serif; padding: 16px; border: 0; border-radius: 10px; background: var(--go); color: var(--card); cursor: pointer; }
button:disabled { opacity: 0.5; }
.status { font-weight: 600; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .live { color: var(--go); }
#message { font: 600 22px ui-monospace, monospace; word-break: break-word; min-height: 1.5em; }
#message .cursor { display: inline-block; width: 0.55em; height: 1em; background: var(--go); vertical-align: -0.1em; margin-left: 2px; }
</style>
</head>
<body>
<main>
  <h1>Secret Sound</h1>
  <p>Encrypted messages as near-ultrasound (17–20 kHz). Works with <code>secret_sound.py</code>.</p>

  <div class="tabs">
    <button id="tabRecv" class="on">Receive</button>
    <button id="tabSend">Send</button>
  </div>

  <div class="card">
    <label for="pw">Password (same on both devices)</label>
    <input id="pw" value="snu-physics-2026" autocomplete="off">
  </div>

  <section id="recvPart">
    <div class="card">
      <button id="listen">Start listening</button>
      <div id="recvStatus" class="status">Not listening</div>
      <label>Message</label>
      <div id="message">—</div>
    </div>
  </section>

  <section id="sendPart" hidden>
    <div class="card">
      <label for="msg">Message</label>
      <textarea id="msg" maxlength="200">my name is avikshit</textarea>
      <button id="send">Send</button>
      <div id="sendStatus" class="status">Turn the volume up.</div>
    </div>
  </section>

  <p id="warn" hidden>Open this page from an https:// address (like GitHub Pages) so the microphone and encryption work.</p>
</main>

<script>
// Receiver for secret_sound.py - same tones, timing and encryption
const bitTime = 0.03;
const tones = [[17600, 17900], [18200, 18500], [18800, 19100], [19400, 19700]];

function smooth(x, rate, ms) {
  const n = Math.floor(rate * ms / 1000);
  for (let i = 0; i < n; i++) {
    const r = n > 1 ? i / (n - 1) : 1;
    x[i] *= r; x[x.length - 1 - i] *= r;
  }
  return x;
}

function startSound(rate) {
  const n = Math.floor(rate * 0.1), x = new Float64Array(n), k = (20200 - 17300) / 0.1;
  for (let i = 0; i < n; i++) { const t = i / rate; x[i] = Math.cos(2 * Math.PI * (17300 * t + 0.5 * k * t * t)); }
  return smooth(x, rate, 5);
}

function biquad(type, f0, q, rate) {
  const w = 2 * Math.PI * f0 / rate, c = Math.cos(w), a = Math.sin(w) / (2 * q), a0 = 1 + a;
  const b = type === "lp" ? [(1 - c) / 2, 1 - c, (1 - c) / 2] : [(1 + c) / 2, -(1 + c), (1 + c) / 2];
  return [b[0] / a0, b[1] / a0, b[2] / a0, -2 * c / a0, (1 - a) / a0];
}

function bandpass(input, rate) {
  const top = Math.min(20500, 0.47 * rate);
  const parts = [biquad("hp", 17000, 0.5412, rate), biquad("hp", 17000, 1.3066, rate),
                 biquad("lp", top, 0.5412, rate), biquad("lp", top, 1.3066, rate)];
  const x = Float64Array.from(input);
  for (let pass = 0; pass < 2; pass++) {
    for (const [b0, b1, b2, a1, a2] of parts) {
      let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
      for (let i = 0; i < x.length; i++) {
        const y = b0 * x[i] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
        x2 = x1; x1 = x[i]; y2 = y1; y1 = y; x[i] = y;
      }
    }
    x.reverse();
  }
  return x;
}

function fft(re, im, inverse) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (inverse ? 2 : -2) * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
      }
    }
  }
  if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}

function energy(x, f, rate) {
  let re = 0, im = 0;
  const n = x.length;
  for (let i = 0; i < n; i++) {
    const w = x[i] * 0.5 * (1 - Math.cos(2 * Math.PI * i / (n - 1)));
    const a = 2 * Math.PI * f * i / rate;
    re += w * Math.cos(a); im -= w * Math.sin(a);
  }
  return re * re + im * im;
}

const median = a => { const s = [...a].sort((p, q) => p - q); return s.length ? s[Math.floor(s.length / 2)] : 0; };

function findStart(audio, rate) {
  const ref = startSound(rate), L = ref.length;
  const x = bandpass(audio, rate);
  let N = 1; while (N < x.length + L) N <<= 1;
  const ar = new Float64Array(N), ai = new Float64Array(N), br = new Float64Array(N), bi = new Float64Array(N);
  ar.set(x); br.set(ref);
  fft(ar, ai, false); fft(br, bi, false);
  for (let k = 0; k < N; k++) {
    const r = ar[k] * br[k] + ai[k] * bi[k], i = ai[k] * br[k] - ar[k] * bi[k];
    ar[k] = r; ai[k] = i;
  }
  fft(ar, ai, true);
  let refPow = 0; for (const v of ref) refPow += v * v;
  const sum = new Float64Array(x.length + 1);
  for (let i = 0; i < x.length; i++) sum[i + 1] = sum[i] + x[i] * x[i];
  const count = x.length - L + 1 - Math.floor(rate * 0.05);
  if (count <= 0) return null;
  const match = new Float64Array(count);
  let best = 0;
  for (let p = 0; p < count; p++) {
    const power = Math.max(sum[p + L] - sum[p], 0);
    match[p] = Math.abs(ar[p]) / Math.sqrt(refPow * power + 1e-12);
    if (match[p] > best) best = match[p];
  }
  if (best < 0.4) return null;
  let p = 0; while (match[p] < 0.8 * best) p++;
  return p;
}

function readSlot(x, pos, length, rate) {
  const bit = Math.floor(rate * bitTime), f = Math.floor(rate * 0.002);
  const end = pos + length - f;
  return x.subarray(end - Math.floor(bit * 0.7) + f, end);
}

function learnRoom(x, start, rate) {
  const n = Math.floor(rate * bitTime * 0.7);
  const before = x.subarray(Math.max(0, start - Math.floor(rate * 0.3)), Math.max(0, start - Math.floor(rate * 0.02)));
  const noiseList = [];
  for (let i = 0; i + n < before.length; i += n) noiseList.push(energy(before.subarray(i, i + n), 18500, rate));
  const noise = noiseList.length ? median(noiseList) : 1e-12;
  const gain = {};
  let pos = start + Math.floor(rate * 0.12);
  const T = Math.floor(rate * 2 * bitTime);
  for (const pair of tones) for (const f of pair) { gain[f] = energy(readSlot(x, pos, T, rate), f, rate); pos += T; }
  const loud = median(Object.values(gain));
  if (loud < 10 * noise) return { gain: null, pos };
  for (const f in gain) gain[f] = Math.max(gain[f], 0.01 * loud);
  return { gain, pos };
}

function readBits(x, pos, gain, first, count, rate) {
  const bits = [], bit = Math.floor(rate * bitTime);
  for (let i = first; i < first + count; i++) {
    const [f0, f1] = tones[i % 4];
    const slot = readSlot(x, pos + i * bit, bit, rate);
    bits.push(energy(slot, f1, rate) / gain[f1] > energy(slot, f0, rate) / gain[f0] ? 1 : 0);
  }
  return bits;
}

function toBytes(bits) {
  const out = new Uint8Array(bits.length / 8);
  for (let i = 0; i < out.length; i++) for (let j = 0; j < 8; j++) out[i] = out[i] * 2 + bits[i * 8 + j];
  return out;
}

async function decrypt(data, password) {
  const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password)));
  const key = await crypto.subtle.importKey("raw", hash.slice(0, 16), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12));
  return new TextDecoder().decode(plain);
}

// Feed it microphone audio; it says what is happening
class Listener {
  constructor(rate) { this.rate = rate; this.audio = new Float32Array(0); this.start = null; this.size = 0; this.got = []; }

  add(chunk) {
    const a = new Float32Array(this.audio.length + chunk.length);
    a.set(this.audio); a.set(chunk, this.audio.length); this.audio = a;
  }

  // returns {status, got, size}
  check() {
    const rate = this.rate, bit = Math.floor(rate * bitTime);
    if (this.start === null) {
      if (this.audio.length > 2 * rate) this.audio = this.audio.slice(this.audio.length - 2 * rate);
      this.start = findStart(this.audio, rate);
      return { status: this.start === null ? "listening" : "receiving", got: [] };
    }
    const need = this.start + Math.floor(rate * 0.62) + bit * 8 + Math.floor(rate / 10);
    if (this.audio.length < need) return { status: "receiving", got: [] };
    const x = bandpass(this.audio, rate);
    if (!this.size) {
      const room = learnRoom(x, this.start, rate);
      const size = room.gain ? toBytes(readBits(x, room.pos, room.gain, 0, 8, rate))[0] : 0;
      if (size < 29) {
        this.audio = this.audio.slice(this.start + Math.floor(rate * 0.1));
        this.start = null;
        return { status: "listening", got: [] };
      }
      this.size = size; this.gain = room.gain; this.pos = room.pos;
    }
    const have = Math.min(this.size, Math.floor((this.audio.length - Math.floor(rate / 10) - this.pos) / (8 * bit)) - 1);
    if (have > this.got.length) {
      const bits = readBits(x, this.pos, this.gain, 8 * (1 + this.got.length), 8 * (have - this.got.length), rate);
      this.got.push(...toBytes(bits));
    }
    return { status: this.got.length === this.size ? "done" : "receiving", got: Uint8Array.from(this.got), size: this.size };
  }
}

async function getKey(password, use) {
  const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password)));
  return crypto.subtle.importKey("raw", hash.slice(0, 16), use === "decrypt" ? "AES-GCM" : use, false, use === "AES-CTR" ? ["decrypt"] : [use === "decrypt" ? "decrypt" : "encrypt"]);
}

// unscramble the letters received so far (same as decrypt_part in the Python program)
async function decryptPart(got, size, password) {
  const part = got.slice(12, Math.min(got.length, size - 16));
  if (got.length <= 12 || part.length === 0) return "";
  const counter = new Uint8Array(16); counter.set(got.slice(0, 12)); counter[15] = 2;
  const key = await getKey(password, "AES-CTR");
  const plain = await crypto.subtle.decrypt({ name: "AES-CTR", counter, length: 32 }, key, part);
  return new TextDecoder().decode(plain);
}

// ---------------- SEND (same sound as the Python program) ----------------
function tone(f, length, rate) {
  const n = Math.floor(rate * length), x = new Float64Array(n);
  for (let i = 0; i < n; i++) x[i] = Math.sin(2 * Math.PI * f * i / rate);
  return smooth(x, rate, 2);
}

async function makeSound(msg, password, rate) {
  const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password)));
  const key = await crypto.subtle.importKey("raw", hash.slice(0, 16), "AES-GCM", false, ["encrypt"]);
  const nonce = crypto.getRandomValues(new Uint8Array(12));
  const enc = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: nonce }, key, new TextEncoder().encode(msg)));
  const data = [12 + enc.length, ...nonce, ...enc];
  const bits = [];
  for (const byte of data) for (let i = 7; i >= 0; i--) bits.push((byte >> i) & 1);
  const parts = [new Float64Array(Math.floor(rate * 0.3)), startSound(rate), new Float64Array(Math.floor(rate * 0.02))];
  for (const pair of tones) for (const f of pair) parts.push(tone(f, 2 * bitTime, rate));
  bits.forEach((b, i) => parts.push(tone(tones[i % 4][b], bitTime, rate)));
  parts.push(new Float64Array(Math.floor(rate * 0.3)));
  const total = parts.reduce((s, p) => s + p.length, 0), sound = new Float32Array(total);
  let o = 0; for (const p of parts) { for (let i = 0; i < p.length; i++) sound[o + i] = 0.6 * p[i]; o += p.length; }
  return { sound, bits: bits.length, hex: Array.from(data.slice(1, 17), v => v.toString(16).padStart(2, "0")).join(" ") };
}


</script>
<script>
const $ = id => document.getElementById(id);
let ctx, stream, mic, node, sink, timer, queue = [], listener, wake, on = false, busy = false;

if (!window.isSecureContext || !navigator.mediaDevices || !window.crypto.subtle) $("warn").hidden = false;

function show(el, text, kind) { el.textContent = text; el.className = "status " + (kind || ""); }
function showText(text, typing) {
  $("message").textContent = text || "—";
  if (typing) { const c = document.createElement("span"); c.className = "cursor"; $("message").appendChild(c); }
}
async function audio() { ctx = ctx || new AudioContext(); await ctx.resume(); return ctx; }

$("tabRecv").onclick = () => { $("recvPart").hidden = false; $("sendPart").hidden = true; $("tabRecv").className = "on"; $("tabSend").className = ""; };
$("tabSend").onclick = () => { stop(); $("recvPart").hidden = true; $("sendPart").hidden = false; $("tabSend").className = "on"; $("tabRecv").className = ""; };

// ---------- receive
async function start() {
  try {
    await audio();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    show($("recvStatus"), "Microphone blocked. Allow it in the browser and try again.", "bad");
    return;
  }
  mic = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  sink = ctx.createGain(); sink.gain.value = 0;
  node.onaudioprocess = e => queue.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  mic.connect(node); node.connect(sink); sink.connect(ctx.destination);
  listener = new Listener(ctx.sampleRate);
  on = true; $("listen").textContent = "Stop listening";
  show($("recvStatus"), "Listening...", "live");
  showText("", false);
  try { wake = await navigator.wakeLock.request("screen"); } catch (e) {}
  timer = setInterval(tick, 250);
}

function stop() {
  if (!on) return;
  on = false; clearInterval(timer); queue = [];
  try { node.disconnect(); mic.disconnect(); sink.disconnect(); } catch (e) {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (wake) wake.release().catch(() => {});
  $("listen").textContent = "Start listening";
}

async function tick() {
  if (busy || !queue.length) return;
  busy = true;
  for (const c of queue.splice(0)) listener.add(c);
  const r = listener.check();
  const pw = $("pw").value;
  if (r.status === "listening") show($("recvStatus"), "Listening...", "live");
  if (r.status === "receiving") {
    show($("recvStatus"), "Receiving...", "live");
    if (r.got.length > 12) showText(await decryptPart(r.got, r.size, pw), true);
  }
  if (r.status === "done") {
    stop();
    try {
      showText(await decrypt(r.got, pw), false);
      show($("recvStatus"), "Message received (checked OK)", "ok");
    } catch (e) {
      show($("recvStatus"), "Could not decrypt it properly (wrong password or damaged)", "bad");
    }
  }
  busy = false;
}

$("listen").onclick = () => on ? (stop(), show($("recvStatus"), "Not listening")) : start();

// ---------- send
$("send").onclick = async () => {
  const msg = $("msg").value.slice(0, 200);
  if (!msg) return;
  const ac = await audio();
  const m = await makeSound(msg, $("pw").value, ac.sampleRate);
  const buf = ac.createBuffer(1, m.sound.length, ac.sampleRate);
  buf.copyToChannel(m.sound, 0);
  const src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
  $("send").disabled = true;
  show($("sendStatus"), `Sending ${m.bits} bits (${(m.sound.length / ac.sampleRate).toFixed(1)} s)...  encrypted: ${m.hex} ...`, "live");
  src.onended = () => { $("send").disabled = false; show($("sendStatus"), "Sent!", "ok"); };
  src.start();
};
</script>
</body>
</html>
